<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d6ff2">
    <title>Offline · Latihan CPNS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #eaf3ff;
            color: #0b1b3f;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main {
            max-width: 420px;
            padding: 32px;
            border: 1px solid #dde7f5;
            border-radius: 16px;
            background: #fff;
            text-align: center;
        }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p { margin: 0 0 20px; color: #4b5b7a; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 12px;
            background: #1d6ff2;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
        a:hover { background: #1458c9; }
    </style>
</head>
<body>
    <main>
        <h1>Koneksi terputus</h1>
        <p>Halaman ini butuh internet. Sambungkan kembali jaringan, lalu muat ulang halaman.</p>
        <a href="/">Coba lagi</a>
    </main>
</body>
</html>
